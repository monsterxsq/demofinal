<style>
  :root {
    --tt-cyan: #1877F2;
    --tt-pink: #0866FF;
    --tt-grad: linear-gradient(100deg, #0866FF, #1877F2);
    --ink: #0b0b0f;
    --muted: #6b7280;
    --track: #f1f1f4;
}
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#fff;color:var(--ink);overflow:hidden;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }

  /* oferta por baixo (lazy) */
  .offer{position:fixed;inset:0;z-index:0;background:#fff}
  .offer iframe{width:100%;height:100%;border:0;display:block}

  /* gate */
  .gate{
    position:fixed;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 22px calc(32px + env(safe-area-inset-bottom));
    text-align:center;
    background:
      radial-gradient(120% 75% at 50% -12%,rgba(37,244,238,.10),transparent 58%),
      radial-gradient(120% 75% at 50% 112%,rgba(254,44,85,.10),transparent 58%),
      #ffffff;
    transition:opacity .55s cubic-bezier(.2,.8,.2,1),transform .55s cubic-bezier(.2,.8,.2,1);
  }
  .gate.revealed{opacity:0;transform:scale(1.035);pointer-events:none}

  .title{
    font-size:clamp(24px,6.8vw,33px);line-height:1.18;font-weight:800;
    letter-spacing:-.02em;max-width:560px;
  }
  .sub{margin-top:12px;color:var(--muted);font-size:clamp(14px,3.8vw,15.5px);max-width:430px;line-height:1.5}

  .slider-wrap{margin-top:52px;width:min(450px,88vw)}

  .unlock-btn{
    width:100%;height:64px;border:0;border-radius:999px;cursor:pointer;
    background:var(--tt-grad);color:#fff;
    font-size:15px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    display:flex;align-items:center;justify-content:center;gap:10px;
    box-shadow:0 12px 26px rgba(254,44,85,.34),0 4px 12px rgba(37,244,238,.28);
    animation:pulseBtn 1.6s ease-in-out infinite;-webkit-tap-highlight-color:transparent;
  }
  .unlock-btn:active{transform:scale(.98)}
  .unlock-btn svg{width:22px;height:22px;display:block}
  @keyframes pulseBtn{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

  .slider{
    position:relative;height:64px;border-radius:999px;
    background:var(--track);border:1px solid #ececf1;
    box-shadow:inset 0 1px 3px rgba(16,16,20,.06),0 8px 22px rgba(16,16,20,.06);
    overflow:hidden;user-select:none;touch-action:none;
  }
  .fill{
    position:absolute;left:0;top:0;height:100%;width:0;border-radius:999px;
    background:var(--tt-grad);opacity:.96;
    transition:width .26s cubic-bezier(.2,.8,.2,1);
  }
  .slider.dragging .fill{transition:none}

  .label{
    position:absolute;inset:0;display:grid;place-items:center;
    color:#9aa0a6;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    pointer-events:none;transition:opacity .2s;
  }
  .slider.dragging .label,.slider.done .label{opacity:0}

  .handle{
    position:absolute;top:6px;left:6px;width:52px;height:52px;border-radius:999px;
    background:var(--tt-grad);
    display:grid;place-items:center;cursor:grab;
    box-shadow:0 10px 22px rgba(254,44,85,.38),0 4px 10px rgba(37,244,238,.32);
    transform:translateX(0);
    transition:transform .26s cubic-bezier(.2,.8,.2,1);
    will-change:transform;
  }
  .slider.dragging .handle{transition:none;cursor:grabbing}
  .handle svg{width:24px;height:24px;display:block}
  .handle::after{
    content:"";position:absolute;inset:0;border-radius:inherit;
    background:linear-gradient(110deg,transparent 32%,rgba(255,255,255,.55) 50%,transparent 68%);
    background-size:220% 100%;animation:shimmer 2.2s linear infinite;pointer-events:none;
  }
  @keyframes shimmer{0%{background-position:220% 0}100%{background-position:-220% 0}}

  .micro{margin-top:22px;color:#9aa0a6;font-size:12.5px;letter-spacing:.02em}
  .micro b{color:var(--muted);font-weight:600}

  @media (max-height:680px){
    .slider-wrap{margin-top:38px}
  }
</style>
